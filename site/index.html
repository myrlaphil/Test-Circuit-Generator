<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test Circuit Generator</title>
  <meta name="description" content="Type a resistor circuit in circuit lingo, get a worksheet-style figure, the answers and a worked solution. Runs entirely in your browser." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css" />
  <style>
    :root { --bg: #ffffff; --fg: #262730; --muted: #6b6f76; --accent: #1f6feb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1117; --fg: #fafafa; --muted: #9aa0a6; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #root { height: 100%; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; padding: 0 16px; text-align: center; background: var(--bg); }
    #boot h1 { font-size: 1.4rem; margin: 0; }
    #boot p { margin: 0; color: var(--muted); max-width: 32rem; line-height: 1.4; }
    #boot .bar { width: min(320px, 80vw); height: 6px; border-radius: 3px; background: #8884; overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 3px;
      animation: slide 1.4s ease-in-out infinite; }
    @keyframes slide { 0% { margin-left: -40% } 100% { margin-left: 100% } }
    #boot.done { display: none; }
  </style>
</head>
<body>
  <div id="boot">
    <h1>⚡ Test Circuit Generator</h1>
    <div class="bar"><i></i></div>
    <p id="status">Loading Python in your browser… the first visit downloads about 30 MB, later visits are faster.</p>
    <p>Everything runs on your computer. Nothing you type is sent to a server.</p>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";
    const status = document.getElementById("status");
    const boot = document.getElementById("boot");
    const files = {};
    for (const f of ["app.py", "lingo.py", "render_worker.py", "exam_pdf.py", "llm.py", "circuit_core.py"]) {
      files[f] = { url: "./" + f };
    }
    mount(
      {
        requirements: ["schemdraw", "matplotlib", "reportlab", "pillow", "pydantic", "numpy", "requests"],
        entrypoint: "app.py",
        files,
        streamlitConfig: { "theme.primaryColor": "#1f6feb", "browser.gatherUsageStats": false },
        onProgress: (msg) => { status.textContent = msg; },
        onLoad: () => { boot.classList.add("done"); },
        onError: (err) => { status.textContent = "Could not start: " + (err && err.message ? err.message : err); },
      },
      document.getElementById("root")
    );
    // Fallback: hide the splash once Streamlit has drawn something, in case onLoad is not fired.
    const watch = setInterval(() => {
      if (document.querySelector('#root [data-testid="stAppViewContainer"]')) { boot.classList.add("done"); clearInterval(watch); }
    }, 1000);
  </script>
</body>
</html>
